services:
  postgres:
    image: postgres:16
    container_name: neu-postgres
    environment:
      POSTGRES_DB: neu_bot
      POSTGRES_USER: neu_bot
      POSTGRES_PASSWORD: neu_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: neu-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: neu-api
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://neu_bot:neu_bot@postgres:5432/neu_bot
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SCAN_INTERVAL_MIN_SECONDS: 1.0
      SCAN_INTERVAL_MAX_SECONDS: 2.5
      JOB_TIMEOUT_SECONDS: 604800
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    container_name: neu-worker
    environment:
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://neu_bot:neu_bot@postgres:5432/neu_bot
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SCAN_INTERVAL_MIN_SECONDS: 1.0
      SCAN_INTERVAL_MAX_SECONDS: 2.5
      JOB_TIMEOUT_SECONDS: 604800
    command: ["celery", "-A", "worker.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../Auto-Regist-Credits-NEU-UI
    container_name: neu-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
